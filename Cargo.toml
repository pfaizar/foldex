[workspace]
members = ["crates/*"]
default-members = ["crates/foldex"]
exclude = ["vendor/wgpu-hal", "vendor/eframe", "vendor/epaint"]
resolver = "3"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
eframe = { path = "vendor/eframe" }
epaint = { path = "vendor/epaint" }

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
version = "0.1.4"

[workspace.dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "accesskit"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }
tokio = { version = "=1.53.2", features = ["rt", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
toml = "=0.9.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
