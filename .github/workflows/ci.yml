name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain $toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test the Windows workspace
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Check release tooling
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Install Inno Setup 6.7
        run: choco upgrade innosetup --version=6.7.0 --yes --no-progress --allow-downgrade
      - name: Build the installer smoke-test application
        run: cargo build --locked --target x86_64-pc-windows-msvc -p foldex
      - name: Exercise install, repair, upgrade, downgrade and uninstall
        shell: pwsh
        run: |
          try {
            ./scripts/test_installer.ps1 -Binary target/x86_64-pc-windows-msvc/debug/foldex.exe
          } finally {
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'foldex-installer-*' | ForEach-Object {
              Get-ChildItem -LiteralPath $_.FullName -File -Filter 'setup-*.log' | ForEach-Object {
                Write-Host "Installer log: $($_.Name)"
                Get-Content -LiteralPath $_.FullName
              }
            }
          }
      - name: Retain installer smoke-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldex-installer-smoke-logs
          path: ${{ runner.temp }}/foldex-installer-*/setup-*.log
          if-no-files-found: ignore
          retention-days: 14

  test-installer:
    name: Downloadable PR installer
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain $toolchain
      - name: Install Inno Setup 6.7
        run: choco upgrade innosetup --version=6.7.0 --yes --no-progress --allow-downgrade
      - name: Build the PR application
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p foldex
      - name: Package a test installer with notices and build provenance
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          sys.path.insert(0, str(Path("scripts").resolve()))
          import package_portable as portable

          version = portable.version()
          commit = portable.run("git", "rev-parse", "HEAD")
          source = f"{portable.REPOSITORY}/tree/{commit}"
          source_archive = f"{portable.REPOSITORY}/archive/{commit}.zip"
          output = portable.ROOT / "dist" / "pr-installer"
          output.mkdir(parents=True, exist_ok=True)
          binary = portable.ROOT / "target" / portable.TARGET / "release" / "foldex.exe"
          portable.validate_x64(binary.read_bytes())
          _, packages = portable.runtime_packages()
          with tempfile.TemporaryDirectory(prefix="foldex-pr-installer-") as temporary:
              stage = Path(temporary)
              shutil.copyfile(binary, stage / "Foldex.exe")
              for name in ("LICENSE", "theme.toml"):
                  shutil.copyfile(portable.ROOT / name, stage / name)
              readme = (portable.ROOT / "packaging/windows/installed-README.md").read_text(encoding="utf-8")
              readme = readme.replace("@VERSION@", version).replace("@SOURCE_URL@", source)
              readme = readme.replace("@SOURCE_ARCHIVE_URL@", source_archive)
              (stage / "README.md").write_text("PR TEST BUILD - not a published release.\n\n" + readme, encoding="utf-8")
              (stage / "foldex-installed.ini").write_text(f"[Installation]\nVersion={version}\n", encoding="utf-8")
              info = {
                  "version": version, "commit": commit, "build_kind": "pull-request-test",
                  "target": portable.TARGET, "renderer": "DirectX 12",
                  "license": "AGPL-3.0-only", "signed": False,
                  "source": source, "source_archive": source_archive,
                  "executable_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              }
              (stage / "BUILD-INFO.json").write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")
              portable.write_notices(stage, packages)
              subprocess.run([
                  r"C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  f"/DAppVersion={version}", f"/DSourceDir={stage}",
                  f"/DReleaseDir={output}", str(portable.ROOT / "packaging/windows/foldex.iss"),
              ], check=True)
              shutil.copyfile(stage / "BUILD-INFO.json", output / "BUILD-INFO.json")
              shutil.copyfile(stage / "README.md", output / "README-TESTING.txt")
          installer = output / f"Foldex-{version}-windows-x64-setup.exe"
          if not installer.is_file() or installer.stat().st_size < 1024:
              raise ValueError("Inno Setup did not produce a complete installer")
          digest = hashlib.sha256(installer.read_bytes()).hexdigest()
          (output / "SHA256SUMS.txt").write_text(f"{digest}  {installer.name}\n", encoding="utf-8")
          print(json.dumps({"installer": installer.name, "sha256": digest, "commit": commit}))
      - name: Retain the downloadable test installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Foldex-PR-${{ github.event.pull_request.number }}-windows-x64-test-installer
          path: dist/pr-installer/
          if-no-files-found: error
          retention-days: 14

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
