name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks and validate CI tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      native: ${{ steps.changes.outputs.native }}
      installer: ${{ steps.changes.outputs.installer }}
      website: ${{ steps.changes.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the full change range
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_changes.py
      - name: Test CI and release tooling
        run: python -B -m unittest discover -s scripts/tests -v

  windows:
    name: Windows x64
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain $toolchain
      - name: Restore Rust build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-x64-tests
          key: ${{ hashFiles('vendor/**') }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        if: needs.changes.outputs.native == 'true'
        run: cargo fmt --all -- --check
      - name: Test the Windows workspace
        if: needs.changes.outputs.native == 'true'
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Install Inno Setup 6.7
        if: needs.changes.outputs.installer == 'true'
        run: choco upgrade innosetup --version=6.7.0 --yes --no-progress --allow-downgrade
      - name: Build the installer smoke-test application
        if: needs.changes.outputs.installer == 'true'
        run: cargo build --locked --target x86_64-pc-windows-msvc -p foldex
      - name: Exercise install, repair, upgrade, downgrade and uninstall
        if: needs.changes.outputs.installer == 'true'
        shell: pwsh
        run: |
          try {
            ./scripts/test_installer.ps1 -Binary target/x86_64-pc-windows-msvc/debug/foldex.exe
          } finally {
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'foldex-installer-*' | ForEach-Object {
              Get-ChildItem -LiteralPath $_.FullName -File -Filter 'setup-*.log' | ForEach-Object {
                Write-Host "Installer log: $($_.Name)"
                Get-Content -LiteralPath $_.FullName
              }
            }
          }
      - name: Retain installer smoke-test logs
        if: always() && needs.changes.outputs.installer == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldex-installer-smoke-logs
          path: ${{ runner.temp }}/foldex-installer-*/setup-*.log
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Corepack provides the pnpm version pinned by packageManager.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
