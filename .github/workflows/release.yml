name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: Require CI for the release source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      ci_passed: ${{ steps.ci.outputs.ci_passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the release source commit
        id: source
        env:
          RELEASE_REF: ${{ inputs.tag || github.sha }}
        run: |
          source_sha=$(git rev-parse --verify --end-of-options "$RELEASE_REF^{commit}")
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Wait for successful CI on the same commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REQUIRE_CI: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          args=(--sha "$SOURCE_SHA")
          if [[ "$REQUIRE_CI" != 'true' ]]; then args+=(--allow-missing); fi
          python -B scripts/ci_gate.py "${args[@]}"

  windows:
    name: Build and publish Windows x64 installer and portable
    needs: ci
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
      RELEASE_INPUT: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release version.' }
          $tag = if ($env:RELEASE_INPUT) { $env:RELEASE_INPUT } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -cne "v$version") { throw 'The release tag does not match the package version.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate the release version and notes
        run: python -B scripts/package_portable.py --tag "$env:RELEASE_TAG" --validate-only
      - name: Check release tooling
        if: needs.ci.outputs.ci_passed != 'true'
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain $toolchain
      - name: Restore Rust build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-x64-release
          key: ${{ hashFiles('vendor/**') }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        if: needs.ci.outputs.ci_passed != 'true'
        run: cargo fmt --all -- --check
      - name: Test the Windows workspace
        if: needs.ci.outputs.ci_passed != 'true'
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Build the release application
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p foldex
      - name: Install Inno Setup 6.7
        run: choco upgrade innosetup --version=6.7.0 --yes --no-progress --allow-downgrade
      - name: Exercise install, repair, upgrade, downgrade and uninstall
        shell: pwsh
        run: |
          try {
            ./scripts/test_installer.ps1 -Binary target/x86_64-pc-windows-msvc/release/foldex.exe
          } finally {
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'foldex-installer-*' | ForEach-Object {
              Get-ChildItem -LiteralPath $_.FullName -File -Filter 'setup-*.log' | ForEach-Object {
                Write-Host "Installer log: $($_.Name)"
                Get-Content -LiteralPath $_.FullName
              }
            }
          }
      - name: Retain installer smoke-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldex-release-installer-smoke-logs
          path: ${{ runner.temp }}/foldex-installer-*/setup-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Create or verify the release source tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 1) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$commit"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag.' }
            git fetch origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the release tag.' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the release tag.'
          }
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) { throw 'The release tag points to different source.' }
      - name: Package the portable ZIP and notices
        run: python -B scripts/package_portable.py --tag "$env:RELEASE_TAG"
      - name: Package the Windows installer
        run: python -B scripts/package_installer.py --tag "$env:RELEASE_TAG" --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Verify the published download inventory
        shell: python
        run: |
          import json
          from pathlib import Path
          import tomllib
          import zipfile

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"]
          expected = {
              f"Foldex-{version}-windows-x64-setup.exe",
              f"Foldex-{version}-windows-x64-portable.zip",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise ValueError(f"Unexpected release files: {sorted(actual)}")
          with zipfile.ZipFile(Path("dist") / f"Foldex-{version}-windows-x64-portable.zip") as archive:
              names = archive.namelist()
              if any(Path(name).name == "BUILD-INFO.json" or "SHA256SUMS" in name for name in names):
                  raise ValueError("The portable ZIP contains removed download metadata")
          print(json.dumps({"downloads": sorted(actual), "portable_files": len(names)}))
      - name: Retain the release downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foldex-windows-x64
          path: |
            dist/Foldex-*-windows-x64-portable.zip
            dist/Foldex-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove the obsolete checksum attachment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $legacyAssets = @(gh release view v0.1.0 --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the previous release.' }
          if ($legacyAssets -contains 'Foldex-0.1.0-SHA256SUMS.txt') {
            gh release delete-asset v0.1.0 Foldex-0.1.0-SHA256SUMS.txt --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the obsolete checksum attachment.' }
          }
          gh release edit v0.1.0 --notes-file docs/releases/v0.1.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the previous release notes.' }
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          $assets = @(
            "dist/Foldex-$version-windows-x64-portable.zip",
            "dist/Foldex-$version-windows-x64-setup.exe"
          )
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            '--draft', '--verify-tag', '--title', "Foldex $version",
            '--notes-file', "docs/releases/$($env:RELEASE_TAG).md"
          )
          if ($version.StartsWith('0.') -or $version.Contains('-')) {
            $releaseArgs += '--prerelease'
          }
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'This version is already published. Publish a new version instead of replacing its assets.' }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh @releaseArgs @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false
