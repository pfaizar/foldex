[package]
name = "foldex-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Disk-backed, paged, cancellable filename index for Foldex"

[features]
diagnostics = []
catalog-experiment = ["dep:memmap2", "dep:windows-sys", "dep:rayon", "dep:crc32fast"]

[dependencies]
foldex-query = { path = "../foldex-query" }
foldex-match = { path = "../foldex-match" }
foldex-fs = { path = "../foldex-fs" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "hooks", "functions"] }
memmap2 = { version = "=0.9.11", optional = true }
rayon = { version = "=1.12.0", optional = true }
crc32fast = { version = "=1.5.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_System_Threading"] }
