[package]
name = "foldex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A native Windows file explorer with tabs, split panes and a keyboard-first launcher"

[build-dependencies]
winresource = "=0.1.34"

[features]
default = ["renderer-wgpu"]
renderer-wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]
renderer-glow = ["eframe/glow"]

[dependencies]
foldex-core = { path = "../foldex-core" }
foldex-ui = { path = "../foldex-ui" }
foldex-index = { path = "../foldex-index", features = ["catalog-experiment"] }
foldex-match = { path = "../foldex-match" }
frizbee = { version = "=0.13.0", default-features = false, features = ["safe_read"] }
foldex-assets = { path = "../foldex-assets" }
foldex-folder-stats = { path = "../foldex-folder-stats" }
foldex-shell = { path = "../foldex-shell" }
foldex-update = { path = "../foldex-update" }
raw-window-handle = "=0.6.2"
eframe = { workspace = true, features = ["links"] }
egui.workspace = true
wgpu = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
notify = { version = "=8.2.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_StationsAndDesktops", "Win32_System_Time", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
